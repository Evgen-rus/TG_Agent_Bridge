function act(title,command,extra=''){return `<button class="action ${extra}" data-action="${command}">${title}</button>`}
function item(title,desc,action='detail',i=0,icon='inbox'){return `<button class="item" data-action="${action}" data-index="${i}"><span class="item-icon">${ico(icon)}</span><span class="item-main"><strong>${esc(title)}</strong><small>${esc(desc)}</small></span><span class="right-arrow">${ico('chevron',16)}</span></button>`}
function panel(title,body,status,source,time,buttons=''){return `<div class="panel big"><div class="panel-heading"><span class="pill">${esc(status)}</span><span class="meta">${esc(time||'Сегодня')}</span></div><div class="panel-title">${esc(title)}</div><div class="panel-body">${esc(body)}</div><div class="meta" style="margin-top:12px">${ico('inbox',13)} ${esc(source)}</div>${buttons}</div>`}
const isRick=()=>d.variant.startsWith('rick');const isB=()=>d.variant.endsWith('b');
function header(){const n=isRick()?'Rick':'Sally',sub=isRick()?'Твои вторые глаза':'Sales Buddy';return `<div class="topline"><span>9:41</span><span class="status-icons">▰▰▰  ◕  ▮</span></div><div class="app-top"><div class="app-identity"><div class="app-mark">${ico(isRick()?'bolt':'sparkles',20)}</div><div><div class="app-name">${n}</div><div class="app-tag">${sub}</div></div></div><span class="avatar" title="Демо-пользователь">Е</span></div>`}
function richHeader(text,sub){return `<div class="eyebrow">${text}</div><h2 class="hello">${sub}</h2>`}
function rickHome(){if(isB())return `<div class="hero-command"><div class="eyebrow">Твой AI-командный центр</div><h2>С чего начнём?</h2><button class="quick-question" data-action="chat"><span>Спроси Рика о проектах или обсуждениях</span>${ico('arrow')}</button></div><div class="section-line"><h3>Рабочие сигналы</h3><button class="link" data-action="inbox">Все события →</button></div>${panel(rickEvents[0].title,rickEvents[0].body,'Требует решения',rickEvents[0].context,'08:42',`<div class="action-row">${act('Разобрать предложение','detail')}</div>`)}<div class="section-line"><h3>Быстрые разделы</h3></div>${item('Обсуждения', 'Последние ситуации', 'inbox',0,'inbox')}${item('Самоаудит','Открыть предложения','extras',0,'shield')}`;
return `${richHeader('Пятница · 16 октября','Всё важное — здесь.')}<div class="sub">Рик собрал события, в которых может понадобиться твоё решение.</div><div class="section-line"><h3>Требует внимания</h3><span class="pill">Демо · 1</span></div>${panel(rickEvents[0].title,rickEvents[0].body,'Нужно решение',rickEvents[0].context,'08:42',`<div class="action-row">${act('Посмотреть предложение','detail')}</div>`)}<div class="section-line"><h3>Последние события</h3><button class="link" data-action="inbox">Все →</button></div>${item('Вопрос по встрече','Команда · вчера','detail',1,'calendar')}${item('Предложение самоаудита','Внутренняя проверка · вчера','detail',2,'sparkles')}<div class="section-line"><h3>Быстрый вопрос</h3></div><button class="quick-question" data-action="chat"><span>Спросить Рика о рабочем чате…</span>${ico('arrow')}</button>`}
function sallyHome(){if(isB())return `<div class="hero-sally"><div class="eyebrow">Sally · Sales Copilot</div><h2>Следующий шаг<br>по сделке</h2><div class="panel-body">По теме «Птицефабрика» стоит уточнить срок, прежде чем готовить окончательный ответ.</div>${act('Разобрать рекомендацию →','detail')}</div><div class="section-line"><h3>На связи с клиентами</h3><button class="link" data-action="deals">Все сделки →</button></div>${item('Птицефабрика','Есть новая рекомендация','detail',0,'briefcase')}${item('Линия упаковки','Нужно уточнить дату','detail',1,'briefcase')}<div class="section-line"><h3>Договорённости</h3></div><div class="panel"><div class="panel-heading"><span style="font-size:12px;font-weight:750">Отправить КП</span><span class="pill neutral">На контроле</span></div><div class="panel-body" style="margin-top:7px">Учебный пример: проверить согласованный срок.</div><div class="action-row">${act('Открыть','extras','secondary')}</div></div>`;
return `${richHeader('Твои продажи','Продолжаем работу.')}<div class="sub">Все сделки и рекомендации собраны в одном месте.</div><div class="section-line"><h3>Мои сделки</h3><button class="link" data-action="deals">Смотреть все →</button></div>${item('Птицефабрика','Тема #101 · есть рекомендация','detail',0,'briefcase')}${item('Линия упаковки','Тема #102 · новое обсуждение','detail',1,'briefcase')}${item('Автоматизация цеха','Тема #103 · черновик','detail',2,'briefcase')}<div class="section-line"><h3>Салли предлагает</h3><span class="pill">Новый совет</span></div>${panel('Уточнить срок подготовки КП','Перед обещанием точной даты запроси у клиента желаемый срок и ключевые условия.','Рекомендация','Птицефабрика','09:10',`<div class="action-row">${act('Открыть сделку','detail')}</div>`)}<div class="section-line"><h3>Договорённости</h3><button class="link" data-action="extras">Открыть →</button></div><div class="info-box">Здесь показываются только реально обнаруженные и подтверждённые договорённости по доступным темам.</div>`}
function listScreen(){const a=isRick()?rickEvents:deals,title=isRick()?'События':'Мои сделки';return `<div class="eyebrow">${isRick()?'Рабочие чаты':'Telegram-темы'}</div><h2 class="hello">${title}</h2><div class="sub">${isRick()?'Эпизоды с контекстом, а не поток сообщений.':'Одна тема соответствует одной сделке.'}</div><button class="quick-question" style="margin:16px 0" data-action="filter">${ico('search')} <span>Поиск и фильтры ${d.filter?'· только новые':''}</span>${ico('chevron')}</button><div class="section-line"><h3>${d.filter?'Отобранные':'Последние'}</h3><span class="meta">Демонстрация</span></div>${a.slice(0,d.filter?1:3).map((e,i)=>item(e.title,e.context+' · '+e.time,'detail',i,isRick()?e.icon:'briefcase')).join('')}`}
function detailScreen(){const a=isRick()?rickEvents:deals,e=a[d.selected]||a[0];if(isRick())return `<button class="detail-back" data-action="inbox">${ico('back')} К событиям</button><div class="eyebrow">Рабочая ситуация · ${e.time}</div><h2 class="detail-heading">${esc(e.title)}</h2><div class="meta">${ico('inbox',13)} ${esc(e.context)}</div><div class="section-line"><h3>Что произошло</h3></div><div class="panel"><div class="panel-body">${esc(e.body)}</div></div><div class="section-line"><h3>Предложение Рика</h3><span class="pill">На согласовании</span></div><div class="panel"><div class="quote">«Предлагаю подтвердить получение вопроса и уточнить, к какой дате требуется окончательный ответ.»</div><div class="panel-body" style="margin-top:12px">Черновик, не отправлен клиенту. Источник и точный текст должны быть доступны в рабочем API.</div></div><div class="action-row">${act('Принять','approve')}${act('Уточнить','chat','secondary')}</div><div style="margin-top:8px">${act('Не применять','reject','ghost')}</div><div class="footer-chip">${ico('shield',13)} Никакой автоотправки в клиентский чат</div>`;
return `<button class="detail-back" data-action="deals">${ico('back')} К сделкам</button><div class="eyebrow">Сделка · ${e.context.split(' · ')[0]}</div><h2 class="detail-heading">${esc(e.title)}</h2><div class="meta">${ico('clock',13)} Последняя активность: ${e.time}</div><div class="section-line"><h3>Рекомендация Салли</h3><span class="pill">Совет</span></div><div class="panel"><div class="panel-title">Как продолжить разговор</div><div class="panel-body">${esc(e.body)}</div><div class="action-row">${act('Обсудить с Салли','chat')}${act('Скопировать совет','copy','secondary')}</div></div><div class="section-line"><h3>История контакта</h3><button class="link" data-action="chat">Диалог →</button></div><div class="timeline"><div class="timeline-mark"><div class="timeline-dot"></div><div class="timeline-stem"></div></div><div class="timeline-text"><b>Клиент задал уточняющий вопрос</b><small>Вчера · сообщение менеджера с пересказом</small></div></div><div class="timeline"><div class="timeline-mark"><div class="timeline-dot"></div><div class="timeline-stem"></div></div><div class="timeline-text"><b>Салли предложила следующий шаг</b><small>Сегодня · рекомендация, не подтверждённый факт</small></div></div><div class="section-line"><h3>Договорённости</h3></div><div class="info-box">Подтверждённые обязательства и напоминания будут взяты только из реального реестра этой темы.</div><div style="margin-top:12px">${act('Посмотреть подтверждение факта','review','secondary')}</div>`}
function chatScreen(){const r=isRick(),msgs=d.messages[r?'rick':'sally'],name=r?'Риком':'Салли';const base=r?[['assistant','Рик','Вижу несколько событий. Могу разобрать конкретный рабочий чат или предложить ответ.'],['user','Вы','Что нужно решить первым?'],['assistant','Рик','Сначала проверь предложение по чату «Проект Альфа». Я не отправляю ответы клиентам самостоятельно.']]:[['user','Вы','Салли, что ответить на вопрос о сроках КП?'],['assistant','Салли','Предлагаю сначала уточнить желаемую дату и параметры заказа. Затем подготовим короткий ответ без неподтверждённых обещаний.']];return `<div class="eyebrow">${r?'Диалог владельца':'Сделка · '+deals[d.selected].title}</div><h2 class="hello">Разговор с ${name}</h2><div class="sub">${r?'Советы и вопросы по рабочим контекстам.':'Черновики остаются у менеджера. Клиенту ничего не отправляется.'}</div><div class="section-line"><h3>Пример переписки</h3><span class="pill neutral">Демо</span></div><div class="chat">${[...base,...msgs].map(x=>`<div class="message ${x[0]==='user'?'user':''}"><div class="by">${esc(x[1])}</div>${esc(x[2])}<small>${x[0]==='user'?'Ваше сообщение':'Ответ AI · демонстрация'}</small></div>`).join('')}</div><div style="height:14px"></div>`}
function extrasScreen(){if(isRick())return `<div class="eyebrow">Дополнительные функции</div><h2 class="hello">Рабочие инструменты</h2><div class="section-line"><h3>Возможности Рика</h3></div>${item('Предложения самоаудита','Проверка и согласование гипотез','review',0,'shield')}${item('Напоминания','Созданные Риком напоминания','reminders',0,'clock')}<div class="info-box">Режим разработчика и серверные операции не открываются всем участникам автоматически. Доступ проверяется по роли.</div>`;return `<div class="eyebrow">Контроль договорённостей</div><h2 class="hello">Договорённости</h2><div class="sub">Реальные обещания и напоминания конкретных тем, без выдуманных показателей.</div><div class="section-line"><h3>Демонстрационные записи</h3></div><div class="panel"><div class="panel-heading"><span class="pill">На контроле</span><span class="meta">Тема #101</span></div><div class="panel-title">Уточнить дату подготовки КП</div><div class="panel-body">Пример для визуализации карточки. Срок не назначен, пока он не подтверждён исходным сообщением.</div><div class="action-row">${act('Открыть сделку','detail')}</div></div><div class="panel"><div class="panel-heading"><span class="pill neutral">Черновик</span><span class="meta">Тема #102</span></div><div class="panel-title">Условия поставки</div><div class="panel-body">Совет модели не считается договорённостью менеджера.</div></div><div style="margin-top:10px">${act('Показать пример проверки факта','review','secondary')}</div>`}
function navBar(){const ns=isRick()?[['home','Обзор','home'],['inbox','События','inbox'],['chat','Диалог','chat'],['extras','Ещё','dots']]:[['home','Главная','home'],['deals','Сделки','briefcase'],['extras','Контроль','calendar'],['chat','Салли','chat']];return `<nav class="bottom-nav" aria-label="Нижняя навигация">${ns.map(([screen,label,ic])=>`<button class="nav-button ${(d.screen===screen || ((screen==='deals'||screen==='inbox')&&d.screen==='detail'))?'active':''}" data-action="${screen}">${ico(ic)}<span>${label}</span></button>`).join('')}</nav>`}
function modal(){if(!d.modal)return '';let kind=d.modal; if(kind==='review')return `<div class="modal-shade"><div class="modal"><div class="eyebrow">Пример подтверждения</div><h3>Изменить сохранённый факт?</h3><p><b>Было:</b> «КП готовится»<br><b>Предлагается:</b> «КП отправлено»<br>Основание: в демо нет подтверждения отправки.</p><div class="info-box">В реальной Sally изменение до подтверждения не применяется. Здесь только демонстрация интерфейса.</div><div class="action-row">${act('Отклонить','reject')}${act('Закрыть','close','secondary')}</div></div></div>`;
return `<div class="modal-shade"><div class="modal"><div class="eyebrow">Демонстрация действия</div><h3>${kind==='approve'?'Принять предложение?':'Отклонить предложение?'}</h3><p>В этом прототипе действие не отправляет команды Rick или Sally. Production потребует серверного подтверждения прав, источника и ревизии.</p><div class="action-row">${act('Только в демо','confirm')}${act('Отмена','close','secondary')}</div></div></div>`}
function content(){let c={home:()=>isRick()?rickHome():sallyHome(),inbox:listScreen,deals:listScreen,detail:detailScreen,chat:chatScreen,extras:extrasScreen}[d.screen]||rickHome;return c()}
function render(){const v=variants[d.variant];document.getElementById('variants').innerHTML=Object.entries(variants).map(([k,x])=>`<button class="variant ${k===d.variant?'active':''}" data-variant="${k}"><div class="var-title">${x.title} ${x.label.split(' / ')[0]}</div><div class="var-sub">${esc(x.sub)}</div></button>`).join('');document.getElementById('left-note').innerHTML=`<div class="overline">Концепция ${v.label}</div><h2 class="aside-title">${esc(v.direction)}</h2><p class="aside-desc">${esc(v.description)}</p><div class="aside-points">${v.points.map((p,i)=>`<div class="aside-point"><b>0${i+1}</b><span>${esc(p)}</span></div>`).join('')}</div>`;document.getElementById('right-note').innerHTML=`<div class="sidebox"><div class="side-label">Зачем такой дизайн</div><p>${esc(v.rationale)}</p><div class="side-label">Цветовая система</div><div class="palette">${v.palette.map(c=>`<span class="swatch" title="${c}" style="background:${c}"></span>`).join('')}</div></div><div class="sidebox"><h3>Как проверить прототип</h3><div class="side-list"><div class="side-row">Переключи концепт наверху.</div><div class="side-row">Нажимай карточки и нижнюю навигацию внутри телефона.</div><div class="side-row">Открой диалог и отправь демонстрационное сообщение.</div><div class="side-row">Посмотри пример подтверждения действия / факта.</div></div></div><div class="sidebox"><h3>Важное ограничение</h3><p>Это UX-демо с вымышленными событиями. К Telegram и Codex не подключено. Отправленные сообщения, права и решения не сохраняются.</p></div>`;const phone=document.getElementById('phone');phone.className=`phone ${d.variant}`;document.getElementById('phoneInner').innerHTML=header()+`<div class="screen-area" id="scrollarea">${content()}</div>`+(d.screen==='chat'?`<form class="composer" id="chatForm"><input id="chatInput" aria-label="Демонстрационное сообщение" placeholder="Написать ${isRick()?'Рику':'Салли'}…" autocomplete="off"><button class="send" type="submit" aria-label="Отправить в демо">${ico('send')}</button></form>`:'')+navBar()+(d.toast?`<div class="toast">${esc(d.toast)}</div>`:'')+modal()}
function setScreen(n){d.screen=n;if(n==='detail'&&d.selected>=3)d.selected=0;d.modal=null;d.toast='';render()}
document.addEventListener('click',async ev=>{const variant=ev.target.closest('[data-variant]');if(variant){d.variant=variant.dataset.variant;d.screen='home';d.selected=0;d.filter=false;d.toast='';d.modal=null;render();return}const el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(el.dataset.index!==undefined)d.selected=Number(el.dataset.index);if(['home','inbox','deals','detail','chat','extras'].includes(a)){setScreen(a);return}if(a==='filter'){d.filter=!d.filter;render();return}if(a==='approve'||a==='reject'||a==='review'){d.modal=a;render();return}if(a==='close'){d.modal=null;render();return}if(a==='confirm'){d.modal=null;d.toast='Демо: решение показано, на сервер не отправлено';render();return}if(a==='copy'){try{await navigator.clipboard.writeText('Предлагаю уточнить желаемый срок и параметры заказа.');d.toast='Черновик скопирован'}catch{d.toast='Копирование недоступно в этом браузере'}render();return}if(a==='reminders'){d.toast='Демо: настоящие напоминания появятся после интеграции';render();return}});
document.addEventListener('submit',ev=>{if(ev.target.id!=='chatForm')return;ev.preventDefault();const input=document.getElementById('chatInput');const value=input?.value.trim();if(!value)return;const key=isRick()?'rick':'sally';d.messages[key].push(['user','Вы',value],['assistant',isRick()?'Рик':'Салли','Демонстрационный ответ. Реальная обработка будет подключена через безопасный серверный API после утверждения дизайна.']);render();const scroll=document.getElementById('scrollarea');scroll.scrollTop=scroll.scrollHeight});
render();
</script></body></html>
